pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Onyx BOOX SDK. Upstream declared this over http:// with allowInsecureProtocol,
        // which makes every build artifact that ends up executing inside the APK
        // MITM-able. The host serves https with a valid certificate, so it does not need
        // to be an insecure channel. Verified: https returns 200 with a valid chain.
        maven { url 'https://repo.boox.com/repository/maven-public/' }
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = 'boox-riddle'
include ':app'
